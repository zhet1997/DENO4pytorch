# Buckingham π 定理数据增强配置（简化版 v2 - 已修正通道顺序）
# 适用于标准化的热传导数据集
#
# ⚠️ 重要：本配置已修正通道映射，与 dataset_packaging.py 的实际打包顺序一致

version: 2

# ============================================================================
# 1. 通道定义：直接映射到 inputs 的通道索引
# ============================================================================
# ⚠️ 必须与 dataset_packaging.py 的 input_channels 顺序完全一致！
#
# 实际打包顺序 (dataset_packaging.py 第90-97行):
#   0: component_power
#   1: cooling_sdf       ← 注意：不是 component_sdf！
#   2: cooling_temp
#   3: coord_x
#   4: coord_y
#   5+: component_sdf    ← 注意：不是 cooling_sdf！

channel_mapping:
  component_power: 0      # ✅ Channel 0: 元件功率密度 [W/m²]
  cooling_sdf: 1          # ✅ Channel 1: 散热窗SDF [m]
  cooling_temp: 2         # ✅ Channel 2: 散热温度 [K]
  coord_x: 3              # ✅ Channel 3: X坐标 [m]
  coord_y: 4              # ✅ Channel 4: Y坐标 [m]
  component_sdf: 5        # ✅ Channel 5+: 元件SDF [m] (可能多通道)


# ============================================================================
# 2. 量纲指数矩阵（Dimensional Exponents Matrix）
# ============================================================================
# 格式: [M, L, t, T] - 质量、长度、时间、温度的指数

dim_exponents:
  component_power: [1, 0, -3, 0]    # W/m² = kg·m²·s⁻³ / m² = kg/s³
  cooling_sdf: [0, 1, 0, 0]         # 长度 [m]
  cooling_temp: [0, 0, 0, 1]        # 温度 [K]
  coord_x: [0, 1, 0, 0]             # 长度 [m]
  coord_y: [0, 1, 0, 0]             # 长度 [m]
  component_sdf: [0, 1, 0, 0]       # 长度 [m]


# ============================================================================
# 3. 特征尺度提取方式（q0 Extraction Method）
# ============================================================================
# 定义如何从 2D 场中提取标量特征值（用于构建 q0 向量）

q0_extraction:
  component_power: mean        # 功率密度场 → 平均功率密度
  cooling_sdf: max             # 散热窗SDF场 → 最大距离
  cooling_temp: mean           # 温度场 → 平均温度
  coord_x: mean_abs            # X坐标 → 绝对值平均（域尺度）
  coord_y: mean_abs            # Y坐标 → 绝对值平均（域尺度）
  component_sdf: max           # 元件SDF场 → 最大距离


# ============================================================================
# 4. 物理边界约束（Physical Bounds）
# ============================================================================
# ⚠️ 重要：边界已根据实际数据分析（check_actual_q0.py）调整
#
# 实际 q0 范围分析：
#   component_power: [141, 442] W/m²
#   cooling_sdf: [0.35, 0.53] m      ← 之前错误地认为是 component_sdf
#   cooling_temp: [268, 275] K
#   coord_x: [0.18, 0.27] m
#   coord_y: [0.18, 0.27] m
#   component_sdf: [0.48, 1.13] m    ← 之前错误地认为是 cooling_sdf

bounds:
  component_power: [100.0, 500.0]     # 功率密度 [W/m²]
  cooling_sdf: [0.45, 1.20]           # 散热窗SDF [m] (实际: 0.48-1.13)
  cooling_temp: [260.0, 280.0]        # 温度 [K]
  coord_x: [0.15, 0.30]               # X坐标 [m] (修正！)
  coord_y: [0.15, 0.30]               # Y坐标 [m] (修正！)
  component_sdf: [0.30, 0.60]         # 元件SDF [m] (实际: 0.35-0.53)


# ============================================================================
# 5. 数据格式
# ============================================================================
data_format: NHWC


# ============================================================================
# 6. 采样参数（Sampling Configuration）
# ============================================================================
sampling:
  method: uniform            # 采样方法: uniform | trunc_norm
  box_range: 0.15            # 盒约束范围: η ∈ [-r, r] (缩放±16%)
  trunc_norm_std: 0.1        # 截断正态分布标准差（仅当 method=trunc_norm 时使用）
  max_trials: 100             # 最大尝试次数（寻找可行解）
  oversample_factor: 5       # 过采样因子
  seed: null                 # 随机种子（null = 使用随机种子）


# ============================================================================
# 修正日志
# ============================================================================
# 
# 2025-10-17: 修正通道映射错误
# 
# 错误原因：
#   - 原配置文件将 component_sdf 映射到通道1，cooling_sdf 映射到通道5
#   - 实际打包时：cooling_sdf 在通道1，component_sdf 在通道5+
#   - 导致 q0 提取和边界约束应用到错误的通道
# 
# 修正内容：
#   1. 交换 component_sdf 和 cooling_sdf 的通道索引
#   2. 根据实际数据重新设置边界
#   3. 调整 coord_x 和 coord_y 的边界（覆盖实际范围）
# 
# 预期效果：
#   - 约束采样可行率从 0% 提升到 > 30%
#   - q0 值在边界内，约束可以正常工作
#


